# SPIKE-LOG — source and configuration provenance

name: Repository validator defect
description: Report reproducible local validation behaviour.
title: "[Bug]: "
body:
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Exact public guard command, finite safe input and observed exit.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Python, operating system and development lock identity.
    validations:
      required: true
  - type: textarea
    id: expectation
    attributes:
      label: Expected behaviour
      description: Include the documented contract and a safe input example.
    validations:
      required: true
