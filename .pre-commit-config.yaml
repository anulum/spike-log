default_language_version:
  python: python3.13
repos:
  - repo: local
    hooks:
      - id: ruff-lint
        name: ruff-lint
        language: system
        entry: .venv/bin/python -m ruff check --no-respect-gitignore src tools tests
        pass_filenames: false
        always_run: true
      - id: ruff-format
        name: ruff-format
        language: system
        entry: .venv/bin/python -m ruff format --check --no-respect-gitignore src tools tests
        pass_filenames: false
        always_run: true
      - id: strict-types
        name: strict-types
        language: system
        entry: .venv/bin/python -m mypy src tools tests
        pass_filenames: false
        always_run: true
      - id: native-documentation
        name: native-documentation
        language: system
        entry: .venv/bin/python tools/check_documentation.py --root . --json
        pass_filenames: false
        always_run: true
