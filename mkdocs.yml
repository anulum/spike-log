# SPIKE-LOG — source and configuration provenance

site_name: Spike Log
site_description: Local validation tooling and planned event-stream recording and replay
strict: true
site_dir: .tool-cache/site
exclude_docs: |
  /internal/
watch: [tools]
hooks: [tools/local_scaffold/documentation_fragments.py]
theme:
  name: material
  custom_dir: overrides
  logo: assets/anulum_logo.png
  favicon: assets/anulum_logo.png
nav:
  - Overview: index.md
  - Architecture: ARCHITECTURE.md
  - Validation tooling: validation-tooling.md
  - Threat model: THREAT_MODEL.md
  - Repository boundary: adr/0001-repository-boundary.md
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [tools]
          options:
            allow_inspection: false
            docstring_style: numpy
            show_source: true
            show_signature_annotations: true
            members_order: source
validation:
  links:
    not_found: warn
    anchors: warn
    unrecognized_links: warn
