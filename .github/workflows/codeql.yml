name: codeql
on:
  workflow_call:
  workflow_dispatch:
permissions: {}
concurrency:
  group: ${{ github.workflow }}-codeql-${{ github.ref }}
  cancel-in-progress: true
jobs:
  analysis:
    name: Source analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13.18"
      - name: Fetch the pinned environment inputs
        run: make fetch-environment-inputs
      - name: Install the complete hash-locked development graph
        run: make environment
      - name: Validate local infrastructure
        run: make source-analysis
      - name: Prepare the verified CodeQL producer bundle
        run: make prepare-codeql
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2
        with:
          languages: python
          build-mode: none
          tools: .tool-cache/native-artifacts/codeql-bundle-python-linux64.tar.zst
          trap-caching: false
          dependency-caching: false
          threads: 2
          ram: 2048
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2
        with:
          upload: never
          upload-database: false
          output: .tool-cache/codeql-results
          threads: 2
          ram: 2048
