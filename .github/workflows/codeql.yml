name: codeql
on:
  workflow_call:
  workflow_dispatch:
permissions: {}
concurrency:
  group: ${{ github.workflow }}-codeql-${{ github.ref }}
  cancel-in-progress: true
jobs:
  analysis:
    name: Source analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      ENVIRONMENT_OWNER_SOURCE: .tool-cache/owner-source
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check out the pinned owner source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: anulum/evidence-manifest-toolkit
          ref: 2db2055b6f01d0aac352baae25ccdcce513e54dc
          path: .tool-cache/owner-source
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.13.18"
      - name: Fetch the pinned environment inputs
        run: make fetch-environment-inputs
      - name: Install the complete hash-locked development graph
        run: make environment
      - name: Validate local infrastructure
        run: make source-analysis
      - name: Prepare the verified CodeQL producer bundle
        run: make prepare-codeql
      - uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea
        with:
          languages: python
          build-mode: none
          tools: .tool-cache/native-artifacts/codeql-bundle-python-linux64.tar.zst
          trap-caching: false
          dependency-caching: false
          threads: 2
          ram: 2048
      - uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea
        with:
          upload: never
          upload-database: false
          output: .tool-cache/codeql-results
          threads: 2
          ram: 2048
