name: security-audit
on:
  workflow_call:
  workflow_dispatch:
permissions: {}
concurrency:
  group: ${{ github.workflow }}-security-audit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  dependency:
    name: Dependency security
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      ENVIRONMENT_OWNER_SOURCE: .tool-cache/owner-source
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check out the pinned owner source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: anulum/evidence-manifest-toolkit
          ref: 2db2055b6f01d0aac352baae25ccdcce513e54dc
          path: .tool-cache/owner-source
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.13.18"
      - name: Fetch the pinned environment inputs
        run: make fetch-environment-inputs
      - name: Install the complete hash-locked development graph
        run: make environment
      - name: Produce an explicit network-backed audit input
        run: make produce-audit
      - name: Validate local infrastructure
        run: make dependency-security
  static:
    name: Static security
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      ENVIRONMENT_OWNER_SOURCE: .tool-cache/owner-source
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check out the pinned owner source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: anulum/evidence-manifest-toolkit
          ref: 2db2055b6f01d0aac352baae25ccdcce513e54dc
          path: .tool-cache/owner-source
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.13.18"
      - name: Fetch the pinned environment inputs
        run: make fetch-environment-inputs
      - name: Install the complete hash-locked development graph
        run: make environment
      - name: Validate local infrastructure
        run: make static-security
  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      ENVIRONMENT_OWNER_SOURCE: .tool-cache/owner-source
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check out the pinned owner source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: anulum/evidence-manifest-toolkit
          ref: 2db2055b6f01d0aac352baae25ccdcce513e54dc
          path: .tool-cache/owner-source
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.13.18"
      - name: Fetch the pinned environment inputs
        run: make fetch-environment-inputs
      - name: Install the complete hash-locked development graph
        run: make environment
      - name: Fetch and verify immutable native producers
        run: make prepare-native
      - name: Validate local infrastructure
        run: make secret-scan
  workflow:
    name: Workflow security
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      ENVIRONMENT_OWNER_SOURCE: .tool-cache/owner-source
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check out the pinned owner source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: anulum/evidence-manifest-toolkit
          ref: 2db2055b6f01d0aac352baae25ccdcce513e54dc
          path: .tool-cache/owner-source
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.13.18"
      - name: Fetch the pinned environment inputs
        run: make fetch-environment-inputs
      - name: Install the complete hash-locked development graph
        run: make environment
      - name: Fetch and verify immutable native producers
        run: make prepare-native
      - name: Validate local infrastructure
        run: make workflow-security
