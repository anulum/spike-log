name: pre-commit
on:
  workflow_call:
  workflow_dispatch:
permissions: {}
concurrency:
  group: ${{ github.workflow }}-pre-commit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    name: Source quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      ENVIRONMENT_OWNER_SOURCE: .tool-cache/owner-source
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check out the pinned owner source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: anulum/evidence-manifest-toolkit
          ref: 2db2055b6f01d0aac352baae25ccdcce513e54dc
          path: .tool-cache/owner-source
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13.18"
      - name: Fetch the pinned environment inputs
        run: make fetch-environment-inputs
      - name: Install the complete hash-locked development graph
        run: make environment
      - name: Validate local infrastructure
        run: make quality
  tests:
    name: Infrastructure tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      ENVIRONMENT_OWNER_SOURCE: .tool-cache/owner-source
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check out the pinned owner source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: anulum/evidence-manifest-toolkit
          ref: 2db2055b6f01d0aac352baae25ccdcce513e54dc
          path: .tool-cache/owner-source
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13.18"
      - name: Fetch the pinned environment inputs
        run: make fetch-environment-inputs
      - name: Install the complete hash-locked development graph
        run: make environment
      - name: Prepare the pinned native fixtures and actual audit input
        env:
          PROVENANCE_INPUTS: vendor/provenance-inputs
          PROVENANCE_ARTIFACTS: .tool-cache/environment-inputs
          PROVENANCE_OWNER_SOURCE: .tool-cache/owner-source
        run: make prepare-test-inputs
      - name: Validate local infrastructure
        run: make test
