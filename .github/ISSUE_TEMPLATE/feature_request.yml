# SPIKE-LOG — source and configuration provenance

name: Planned capability or validator improvement
description: Propose a clear boundary and observable acceptance criteria.
title: "[Feature]: "
body:
  - type: textarea
    id: use_case
    attributes:
      label: Use case and ownership
      description: Describe the producer, consumer and unsupported capability.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance evidence
      description: Give real public entry points, failure cases and source provenance.
    validations:
      required: true
