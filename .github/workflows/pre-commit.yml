name: pre-commit
on:
  workflow_call:
  workflow_dispatch:
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    name: Source quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13.16"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install the complete hash-locked development graph
        run: make environment
      - name: Validate local infrastructure
        run: make quality
  tests:
    name: Infrastructure tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13.16"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install the complete hash-locked development graph
        run: make environment
      - name: Prepare the pinned native fixtures and actual audit input
        run: make prepare-test-inputs
      - name: Validate local infrastructure
        run: make test
